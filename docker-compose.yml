# =====prod in here

version: "3.9"

services:
  # ===========================
  # BACKEND - EXPRESS + PRISMA
  # ===========================
  backend:
    build:
      context: ./be
    env_file:
      - ./be/.env
    expose:
      - "3001"
    volumes:
      - ./be:/app
      - /app/node_modules
      - ./be/.env:/app/.env
    working_dir: /app
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mysql://root:rootpassword@mysql:3306/sekolahcasn
    command: sh -c "npx prisma generate && npm run dev"
    depends_on:
      - mysql
    networks:
      - dockermate_network
    restart: always

  # ===========================
  # DATABASE - MYSQL
  # ===========================
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sekolahcasn
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3304:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dockermate_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================
  # DATABASE ADMIN - PHPMYADMIN
  # ===========================
  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8082:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - UPLOAD_LIMIT=256M
    depends_on:
      - mysql
    networks:
      - dockermate_network
  
  haproxy:
    image: haproxy:2.9-alpine
    container_name: haproxy
    restart: always
    ports:
      - "80:80"
      - "1936:1936" # dashboard haproxy
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - backend
    networks:
      - dockermate_network


# ===========================
# VOLUMES & NETWORKS
# ===========================
volumes:
  mysql_data:

networks:
  dockermate_network:
    driver: bridge
